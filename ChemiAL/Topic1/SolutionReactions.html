<style>
/* Layout: one column; tabs on top, type switch, question chips, a single question card. */
:root {
  --bg: #F1F6F8; --surface: #FFFFFF; --ink: #12283B; --muted: #4A5F72; --line: #C3D2DC;
  --accent: #0A6E69; --accent-ink: #FFFFFF; --tint: #DDEFED; --pop: #B3125A; --focus: #0B57D0;
  --chip: #E3EDF2; --ok: #14663F; --okbg: #DDF2E6; --warnbg: #FCE8EF;
  --display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1822; --surface: #142636; --ink: #E8F0F6; --muted: #AFC1CF; --line: #2D465B;
    --accent: #5EDCCF; --accent-ink: #052320; --tint: #17403F; --pop: #FF93BC; --focus: #8AB4FF;
    --chip: #1D3447; --ok: #7BE0A8; --okbg: #153B29; --warnbg: #44202F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1822; --surface: #142636; --ink: #E8F0F6; --muted: #AFC1CF; --line: #2D465B;
  --accent: #5EDCCF; --accent-ink: #052320; --tint: #17403F; --pop: #FF93BC; --focus: #8AB4FF;
  --chip: #1D3447; --ok: #7BE0A8; --okbg: #153B29; --warnbg: #44202F; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6;
  padding-inline: 1rem; padding-block: 0 3rem; margin: 0;
}
.wrap { max-width: 60rem; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0 0 .6rem; }
sub, sup { line-height: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .75rem 1rem; z-index: 10; }
.skip:focus { left: 1rem; top: 1rem; }

/* header */
.top { display: flex; align-items: center; gap: 1rem; padding-block: 1.25rem .75rem; flex-wrap: wrap; }
.top svg { width: 3.25rem; height: 3.25rem; flex: none; }
.top h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -.01em; }
.top p { margin: 0; color: var(--muted); }
.top > div { min-width: 0; flex: 1 1 14rem; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .5rem; margin-block: .5rem 1rem; }
.tab {
  display: flex; align-items: center; gap: .6rem; min-height: 3.5rem; padding: .5rem .9rem; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; font-weight: 700;
}
.tab .num { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--chip); font-family: var(--display); flex: none; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab[aria-selected="true"] .num { background: var(--accent-ink); color: var(--accent); }

/* type switch */
.types { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.pill { min-height: 2.75rem; padding: .4rem 1rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
.pill[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); box-shadow: inset 0 0 0 1px var(--accent); }

/* intro */
.intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .75rem; margin-bottom: 1rem; }
.intro > div, .toolkit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; min-width: 0; }
.intro h3, .toolkit summary { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 700; margin-bottom: .3rem; }
.intro .watch { border-left: 6px solid var(--pop); }
.toolkit { margin-bottom: 1rem; }
.toolkit summary { cursor: pointer; margin: 0; min-height: 2.75rem; display: flex; align-items: center; }
.toolkit .tk { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; padding-top: .5rem; }
.toolkit .tk .viz { width: 9rem; padding: .25rem; flex: none; }
.toolkit ul { margin: 0; padding-left: 1.1rem; flex: 1 1 14rem; min-width: 0; }
.toolkit li { margin-bottom: .35rem; }

/* question chips */
.qnav { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.chip { min-width: 3rem; min-height: 3rem; padding: .3rem .85rem; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; position: relative; }
.chip[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.done::after { content: '✓'; margin-left: .35rem; color: var(--ok); font-weight: 800; }
.chip.done[aria-current="true"]::after { color: var(--accent-ink); }

/* question card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem; display: grid; gap: 1rem; min-width: 0; }
.card header { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline; justify-content: space-between; }
.card h2 { font-size: 1.35rem; }
.badge { font-size: .85rem; font-weight: 700; padding: .15rem .6rem; border-radius: 999px; background: var(--tint); color: var(--ink); }
.qtext { font-size: 1.2rem; line-height: 1.55; margin: 0; }
.ram { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; background: var(--chip); border-radius: 10px; padding: .55rem .75rem; }
.ram b { margin-right: .25rem; }
.ram span.el { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .1rem .6rem; font-weight: 700; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 46rem) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.viz { background: #FFFFFF; color: #14283A; border: 2px solid var(--line); border-radius: 12px; padding: .5rem; min-width: 0; }
.viz svg { display: block; width: 100%; height: auto; max-width: 34rem; margin-inline: auto; }
.hint { border: 2px solid var(--ink); border-radius: 6px; padding: .6rem .9rem; }
.hint strong { display: block; margin-bottom: .2rem; }
.hint ol { margin: 0; padding-left: 1.25rem; }
.hint .rem { margin-top: .5rem; padding-top: .5rem; border-top: 1px dashed var(--line); }

/* answer */
.ans { display: grid; gap: .5rem; }
.ans label { font-weight: 700; }
.ans .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: stretch; }
.ans input { font: inherit; min-height: 3rem; width: 9rem; max-width: 100%; padding: .3rem .7rem; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); }
.ans .unit { align-self: center; font-weight: 700; }
.btn { min-height: 3rem; padding: .4rem 1.1rem; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.fb { min-height: 1.5rem; margin: 0; font-weight: 700; padding: 0; }
.fb.ok { background: var(--okbg); color: var(--ok); padding: .5rem .75rem; border-radius: 10px; }
.fb.no { background: var(--warnbg); color: var(--pop); padding: .5rem .75rem; border-radius: 10px; }

/* steps */
.controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.prog { display: flex; gap: .35rem; align-items: center; margin-left: auto; }
.prog i { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.prog i.on { background: var(--accent); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; counter-reset: s; }
.step { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: .8rem .9rem .8rem .9rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .8rem; }
.step.new { animation: slide .5s ease-out both; }
.step .n { grid-row: 1 / span 3; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.step h3 { font-size: 1.1rem; margin-top: .15rem; }
.step .body { min-width: 0; }
.step .fm { font-size: 1.08rem; overflow-wrap: anywhere; }
.step .eq { font-size: 1.12rem; font-weight: 700; overflow-wrap: anywhere; }
.res { background: var(--tint); border-radius: 6px; padding: .05rem .4rem; font-weight: 800; white-space: nowrap; }
.step.new .res { animation: flash 1.4s ease-out .5s both; }
.keys { display: flex; flex-wrap: wrap; gap: .4rem .75rem; align-items: center; border: 2px dashed var(--accent); border-radius: 10px; padding: .45rem .7rem; margin-top: .3rem; }
.keys b { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
.keys code { font-family: var(--mono); font-size: 1.02rem; font-weight: 700; overflow-wrap: anywhere; }
.step .viz { margin-top: .6rem; }
.pager { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: space-between; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
footer { margin-top: 2rem; color: var(--muted); font-size: .95rem; }

/* svg animation */
.liq { transform-box: fill-box; transform-origin: 50% 100%; animation: rise 1s ease-out both; }
.grow { transform-box: fill-box; transform-origin: 0 50%; animation: growx .9s ease-out both; }
.dot { transform-box: fill-box; transform-origin: center; animation: popin .5s ease-out both; }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes popin { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
@keyframes slide { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 5px var(--accent); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (max-width: 34rem) {
  .step { grid-template-columns: minmax(0, 1fr); padding: .7rem; }
  .step .n { grid-row: auto; width: 1.9rem; height: 1.9rem; }
  .card { padding: .8rem; }
}

      s += txt(336, y + 19, lim ? 'LIMITING' : 'EXCESS', { a: 'end', w: 800, s: 12, f: lim ? PINK : '#1F6B49' });
    });
    s += txt(180, 168, 'Shorter bar runs out first = limiting', { s: 13, w: 700 });
    return wrap(s, '0 0 360 182', 'Bar chart of moles divided by coefficient. ' + plain(chem(v.lim === 1 ? v.a.f : v.b.f)) + ' has the shorter bar, so it is the limiting reactant.');
  }

  /* percentage by mass */
  function pct(v) {
    var id = ++uid, W = 300, w = W * v.pct / 100, s = '';
    s += '<defs><pattern id="i' + id + '" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E7EBEF"/><rect width="3" height="8" fill="#8A97A6"/></pattern></defs>';
    s += '<rect x="30" y="40" width="' + W + '" height="38" fill="url(#i' + id + ')" stroke="#44546A" stroke-width="2.5"/>';
    s += '<rect class="grow" x="30" y="40" width="' + w + '" height="38" fill="#B5E3CB" stroke="#1F6B49" stroke-width="2.5"/>';
    s += txt(30, 28, 'Whole sample = ' + esc(v.total) + ' g', { a: 'start', w: 700, s: 13 });
    s += txt(30 + w / 2, 65, esc(CHEM.util.fmt(v.pct)) + ' %', { w: 800, s: 15, f: '#0F4F36' });
    s += txt(30, 104, 'Green = pure ' + svgF(v.f) + ' (' + esc(v.mass) + ' g).  Hatched = impurities.', { a: 'start', s: 12.5 });
    return wrap(s, '0 0 360 118', 'Bar showing ' + CHEM.util.fmt(v.pct) + ' percent of the sample is pure ' + plain(chem(v.f)) + '.');
  }

  /* basicity */
  function basic(v) {
    if (!v.x) {
      var u = '<circle cx="60" cy="70" r="34" fill="' + COL.acid[0] + '" stroke="' + COL.acid[1] + '" stroke-width="3"/>' + txt(60, 77, 'A', { s: 22, w: 800 });
      u += '<path d="M92,70 L128,70" stroke="' + COL.acid[1] + '" stroke-width="2.5"/>';
      u += '<rect class="dot" x="128" y="50" width="62" height="40" rx="20" fill="#FFFFFF" stroke="' + COL.acid[1] + '" stroke-width="2.5"/>' + txt(159, 76, 'x H⁺', { s: 15, w: 800 });
      u += txt(212, 77, '+', { s: 20, w: 700 });
      u += '<rect class="dot" style="animation-delay:.2s" x="232" y="48" width="84" height="44" rx="22" fill="' + COL.base[0] + '" stroke="' + COL.base[1] + '" stroke-width="2.5"/>' + txt(274, 76, 'x OH⁻', { s: 15, w: 800 });
      u += txt(60, 124, 'H<tspan baseline-shift="sub" font-size="72%">x</tspan>A', { w: 800, s: 15 });
      u += txt(180, 124, 'x = number of H⁺ in one acid molecule', { s: 12.5 });
      return wrap(u, '0 0 360 140', 'An acid H x A gives x hydrogen ions. Each one reacts with one hydroxide ion, so one mole of acid needs x moles of hydroxide.');
    }
    var x = v.x, n = x || 3, s = '', i;
    var cy = 80, h = 44;
    s += '<circle cx="60" cy="' + cy + '" r="34" fill="' + COL.acid[0] + '" stroke="' + COL.acid[1] + '" stroke-width="3"/>' + txt(60, cy + 7, 'A', { s: 22, w: 800 });
    for (i = 0; i < n; i++) {
      var y = cy + (i - (n - 1) / 2) * h;
      var dash = x ? '' : ' stroke-dasharray="4 3"';
      s += '<path d="M92,' + (cy + (i - (n - 1) / 2) * 12) + ' L150,' + y + '" stroke="' + COL.acid[1] + '" stroke-width="2.5" fill="none"' + dash + '/>';
      s += '<circle class="dot" style="animation-delay:' + (i * 0.15) + 's" cx="164" cy="' + y + '" r="14" fill="#FFFFFF" stroke="' + COL.acid[1] + '" stroke-width="2.5"' + dash + '/>' + txt(164, y + 5, 'H⁺', { s: 12, w: 800 });
      s += txt(214, y + 5, '+', { s: 18, w: 700 });
      s += '<circle class="dot" style="animation-delay:' + (0.2 + i * 0.15) + 's" cx="262" cy="' + y + '" r="19" fill="' + COL.base[0] + '" stroke="' + COL.base[1] + '" stroke-width="2.5"' + dash + '/>' + txt(262, y + 5, 'OH⁻', { s: 12, w: 800 });
    }
    s += txt(60, 140 + (n > 2 ? 12 : 0), x ? 'H' + '<tspan baseline-shift="sub" font-size="72%">' + x + '</tspan>A' : 'H<tspan baseline-shift="sub" font-size="72%">x</tspan>A', { w: 800, s: 15 });
    s += txt(300, cy + 5, x ? '= ' + x : '= ?', { s: 20, w: 800, f: x ? TEAL : PINK, a: 'start' });
    return wrap(s, '0 0 360 ' + (n > 2 ? 170 : 150), x ? 'Each acid molecule gives ' + x + ' H plus ions, each reacting with one OH minus. Basicity is ' + x + '.' : 'An acid H x A gives x hydrogen ions, each reacting with one hydroxide ion.');
  }

  /* mole triangle for the toolkit */
  function triangle() {
    var s = '<path d="M90,16 L168,150 L12,150 Z" fill="#E6F2F1" stroke="' + TEAL + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M44,96 L136,96 M90,96 L90,150" stroke="' + TEAL + '" stroke-width="3"/>' +
      txt(90, 80, 'n', { s: 28, w: 800 }) + txt(52, 134, 'c', { s: 28, w: 800 }) + txt(128, 134, 'V', { s: 28, w: 800 });
    return wrap(s, '0 0 180 164', 'Formula triangle: n on top, c and V along the bottom. n equals c times V.');
  }

  CHEM.viz = function (v) {
    return ({ mix: mix, ratio: ratio, volsum: volsum, sets: sets, pct: pct, basic: basic })[v.k](v);
  };
  CHEM.triangle = triangle;
})(typeof globalThis !== 'undefined' ? globalThis : window);
</script>
<script>
/* UI: tabs, topic switch, question chips, one question card with stepped help */
(function () {
  'use strict';
  var CH = window.CHEM, U = CH.util, chem = U.chem, TABS = CH.TABS;
  document.documentElement.lang = 'en';
  var S = { t: 0, y: 0, q: 0 }, shown = {}, solved = {}, tries = {};
  try { solved = JSON.parse(localStorage.getItem('solution-reactions-done') || '{}') || {}; } catch (e) { solved = {}; }
  function save() { try { localStorage.setItem('solution-reactions-done', JSON.stringify(solved)); } catch (e) { /* storage unavailable */ } }
  function $(id) { return document.getElementById(id); }
  function key(t, y, q) { return t + '-' + y + '-' + q; }
  function type() { return TABS[S.t].types[S.y]; }
  function reduce() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function say(msg) { var l = $('live'); l.textContent = ''; setTimeout(function () { l.textContent = msg; }, 30); }

  /* ----- tabs ----- */
  function renderTabs() {
    var h = '';
    TABS.forEach(function (t, i) {
      h += '<button role="tab" class="tab" id="tab' + i + '" aria-controls="panel" aria-selected="' + (i === S.t) + '" tabindex="' + (i === S.t ? 0 : -1) + '" data-i="' + i + '">' +
        '<span class="num" aria-hidden="true">' + (i + 1) + '</span><span>' + t.label + '</span></button>';
    });
    $('tabs').innerHTML = h;
  }
  function selectTab(i, focus) {
    S.t = i; S.y = 0; S.q = 0; renderTabs(); renderPanel(false);
    if (focus) $('tab' + i).focus();
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (b) selectTab(+b.dataset.i, false);
  });
  $('tabs').addEventListener('keydown', function (e) {
    var n = TABS.length, i = S.t, k = e.key;
    if (k === 'ArrowRight') i = (i + 1) % n; else if (k === 'ArrowLeft') i = (i + n - 1) % n;
    else if (k === 'Home') i = 0; else if (k === 'End') i = n - 1; else return;
    e.preventDefault(); selectTab(i, true);
  });

  /* ----- panel ----- */
  function toolkit() {
    return '<details class="toolkit"><summary>Mole toolkit: formulas you need (tap to open)</summary><div class="tk">' +
      '<ul>' +
      '<li><b>n = c × V ÷ 1000</b> &nbsp;(c in mol dm⁻³, V in cm³)</li>' +
      '<li><b>c = n ÷ (V ÷ 1000)</b></li>' +
      '<li><b>n = mass ÷ Mr</b> &nbsp;(for solids)</li>' +
      '<li>1 M means 1 mol dm⁻³. &nbsp;1 dm³ = 1000 cm³.</li>' +
      '<li>Keep the full calculator number and round only at the end (3 significant figures).</li></ul></div></details>';
  }
  function renderPanel(focusCard) {
    var t = TABS[S.t], ty = type(), h = '';
    h += '<div class="types" role="group" aria-label="Question type">';
    t.types.forEach(function (x, i) {
      h += '<button class="pill" data-y="' + i + '" aria-pressed="' + (i === S.y) + '">' + x.label + '</button>';
    });
    h += '</div>';
    h += '<h2 class="sr">' + ty.title + '</h2>';
    h += '<div class="intro"><div><h3>The idea</h3><p>' + ty.intro.idea + '</p></div><div class="watch"><h3>Watch out</h3><p>' + ty.intro.watch + '</p></div></div>';
    h += toolkit();
    h += '<div class="qnav" id="qnav" role="group" aria-label="Questions"></div>';
    h += '<article class="card" id="qcard" aria-label="Question"></article>';
    $('panel').setAttribute('aria-labelledby', 'tab' + S.t);
    $('panel').innerHTML = h;
    renderChips(); renderCard(focusCard);
  }
  function renderChips() {
    var ty = type(), h = '';
    ty.qs.forEach(function (q, i) {
      var d = solved[key(S.t, S.y, i)];
      h += '<button class="chip' + (d ? ' done' : '') + '" data-q="' + i + '" aria-current="' + (i === S.q) + '"' +
        ' aria-label="' + (i === 0 ? 'Worked example' : 'Practice ' + i) + (d ? ', answered correctly' : '') + '">' + (i === 0 ? 'Demo' : 'Q' + i) + '</button>';
    });
    $('qnav').innerHTML = h;
  }
  $('panel').addEventListener('click', function (e) {
    var p = e.target.closest('.pill'), c = e.target.closest('.chip');
    if (p) { S.y = +p.dataset.y; S.q = 0; renderPanel(false); }
    else if (c) { S.q = +c.dataset.q; renderChips(); renderCard(true); }
  });

  /* ----- question card ----- */
  function stepHTML(s, i) {
    var h = '<span class="n" aria-hidden="true">' + (i + 1) + '</span><div class="body"><h3><span class="sr">Step ' + (i + 1) + ': </span>' + s.t + '</h3>' + s.h;
    if (s.k) h += '<div class="keys"><b>Calculator</b><code>' + s.k + '</code></div>';
    
    return h + '</div>';
  }
  function renderCard(focus) {
    var ty = type(), q = ty.qs[S.q], demo = S.q === 0, k = key(S.t, S.y, S.q), total = q.steps.length;
    if (shown[k] === undefined) shown[k] = demo ? 1 : 0;
    var h = '<header><h2 id="qh" tabindex="-1">' + (demo ? 'Worked example' : 'Practice ' + S.q + ' of ' + (ty.qs.length - 1)) + '</h2><span class="badge">' + ty.label + '</span></header>';
    h += '<p class="qtext">' + chem(q.text) + '</p>';
    if (q.ram) {
      h += '<div class="ram"><b>Relative atomic masses (RAM):</b>' + q.ram.map(function (r) { return '<span class="el">' + r.el + ' = ' + r.v + '</span>'; }).join('') + '</div>';
    }
    var showViz = false;
    h += showViz ? '<div class="grid2"><div class="viz">' + CH.viz(q.viz).html + '</div>' : '<div>';
    var hint = '';
    if (demo) hint = '<div class="hint"><strong>Hint:</strong><ol>' + q.hints.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>' +
      (q.reminder ? '<div class="rem"><strong>Reminder:</strong> ' + q.reminder + '</div>' : '') + '</div>';
    else if (q.reminder) hint = '<div class="hint"><strong>Reminder:</strong> ' + q.reminder + '</div>';
    h += hint + '</div>';
    var a = q.answer, sf = a.unit === '' ? 'a whole number' : '3 significant figures';
    h += '<form class="ans" id="aform" novalidate><label for="ain">' + (demo ? 'Try it first. ' : '') + a.label + ' <span style="font-weight:400">(' + sf + ')</span></label>' +
      '<div class="row"><input id="ain" type="text" inputmode="decimal" autocomplete="off" aria-describedby="fb"><span class="unit">' + a.unit + '</span>' +
      '<button class="btn" type="submit">Check answer</button></div><p class="fb" id="fb" role="status"></p></form>';
    h += '<div class="controls" id="ctl"><button class="btn" id="next" type="button"></button><button class="btn ghost" id="all" type="button">Show all steps</button>' +
      '<button class="btn ghost" id="hide" type="button">Hide steps</button><span class="prog" id="prog" aria-hidden="true"></span></div>';
    h += '<ol class="steps" id="steps" aria-label="Worked steps"></ol>';
    var ps = ty.qs.length, nextT = null;
    if (S.q === ps - 1) {
      var tt = TABS[S.t];
      if (S.y + 1 < tt.types.length) nextT = { t: S.t, y: S.y + 1, l: tt.types[S.y + 1].label };
      else if (S.t + 1 < TABS.length) nextT = { t: S.t + 1, y: 0, l: TABS[S.t + 1].types[0].label };
    }
    h += '<div class="pager"><button class="btn ghost" id="prev" type="button"' + (S.q === 0 ? ' disabled' : '') + '>← Previous</button>';
    if (S.q < ps - 1) h += '<button class="btn ghost" id="nq" type="button">Next question →</button>';
    else if (nextT) h += '<button class="btn" id="nt" type="button" data-t="' + nextT.t + '" data-y="' + nextT.y + '">Next topic: ' + nextT.l + ' →</button>';
    h += '</div>';
    $('qcard').innerHTML = h;

    var list = $('steps');
    function sync(n, announce) {
      var have = list.children.length, i;
      for (i = have; i < n; i++) {
        var li = document.createElement('li'); li.className = 'step new'; li.innerHTML = stepHTML(q.steps[i], i); list.appendChild(li);
        if (announce) { try { li.scrollIntoView({ block: 'nearest', behavior: reduce() ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ } }
      }
      while (list.children.length > n) list.removeChild(list.lastChild);
      shown[k] = n;
      var nb = $('next'); nb.disabled = n >= total;
      nb.textContent = n >= total ? 'All ' + total + ' steps shown' : (n === 0 ? 'Show first step' : 'Show step ' + (n + 1) + ' of ' + total);
      $('all').disabled = n >= total; $('hide').disabled = n === 0;
      var d = ''; for (i = 0; i < total; i++) d += '<i class="' + (i < n ? 'on' : '') + '"></i>';
      $('prog').innerHTML = d;
      if (announce && n > 0 && n > have) say('Step ' + n + ' of ' + total + ': ' + q.steps[n - 1].t);
    }
    sync(shown[k], false);
    list.querySelectorAll('.step').forEach(function (el) { el.classList.remove('new'); });
    $('next').addEventListener('click', function () { sync(Math.min(total, shown[k] + 1), true); });
    $('all').addEventListener('click', function () { sync(total, true); say('All steps shown.'); });
    $('hide').addEventListener('click', function () { sync(0, false); say('Steps hidden.'); });
    $('aform').addEventListener('submit', function (e) { e.preventDefault(); check(q, k); });
    $('prev').addEventListener('click', function () { S.q--; renderChips(); renderCard(true); });
    if ($('nq')) $('nq').addEventListener('click', function () { S.q++; renderChips(); renderCard(true); });
    if ($('nt')) $('nt').addEventListener('click', function (e) {
      var b = e.currentTarget; S.t = +b.dataset.t; S.y = +b.dataset.y; S.q = 0; renderTabs(); renderPanel(true);
    });
    if (focus) $('qh').focus();
  }

  function check(q, k) {
    var raw = $('ain').value.replace(/,/g, ''), m = raw.match(/-?\d*\.?\d+(?:e[+-]?\d+)?/i), fb = $('fb');
    if (!m) { fb.className = 'fb no'; fb.textContent = 'Type your answer as a number first.'; return; }
    var x = parseFloat(m[0]), a = q.answer, rel = Math.abs(x - a.v) / a.v;
    if (rel <= a.tol) {
      fb.className = 'fb ok';
      fb.textContent = 'Correct! ' + (a.unit === '' ? 'Basicity = ' + a.v + ' (' + a.word + ').' : U.fmt(a.v) + ' ' + a.unit + '.');
      solved[k] = true; save(); renderChips();
    } else if (rel <= 0.05 && a.unit !== '') {
      fb.className = 'fb no'; fb.textContent = 'Very close. Check your rounding (3 significant figures) or the last step.';
    } else {
      tries[k] = (tries[k] || 0) + 1;
      fb.className = 'fb no';
      fb.textContent = tries[k] >= 2 ? 'Not yet. Press “Show step” and compare each number with your working.' : 'Not yet. Check your working or open the first step for help.';
    }
  }

  renderTabs(); renderPanel(false);
})();
</script>

</body></html>
